# AndroidX 必需配置
android.useAndroidX=true
# 注意：AGP 9 已移除 Jetifier，不能再写 android.enableJetifier=true

# 构建优化
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# 单模块项目，4G 足够；若编译期出现 OutOfMemoryError 可上调
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# R 类只生成自身模块资源，减少无用符号
android.nonTransitiveRClass=true

# 项目路径含中文（E:\AI对话），AGP 在 Windows 上默认直接拒绝构建。
# 这里显式放行；若后续 aapt2 / R8 因路径编码报错，把项目移到纯 ASCII 路径即可。
android.overridePathCheck=true
